[project]
name = "minilib"
version = "0.1.0"
description = "Mała biblioteka: katalog książek, czytelnicy, przypomnienia o zwrocie."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
minilib = "minilib.catalog:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.14",
    "locust>=2.47.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::starlette.exceptions.StarletteDeprecationWarning"]
